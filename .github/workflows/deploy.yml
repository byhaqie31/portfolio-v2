name: Deploy via GHCR

# Image-based pipeline: GitHub Actions builds + pushes the Nuxt image to GHCR,
# then the VPS only pulls + restarts (~10-15s, near-zero VPS load) instead of
# running a full `nuxt build` on the box (2-5min, CPU/RAM spikes).
#
# Image: ghcr.io/byhaqie31/portfolio-v2  (PUBLIC → VPS pulls without login)

on:
  push:
    branches: [main]

# One prod deploy at a time — never let two pushes race on the VPS.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: Build + push image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/byhaqie31/portfolio-v2:latest
            ghcr.io/byhaqie31/portfolio-v2:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull + restart on VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd ~/portfolio-v2

            echo "=== sync compose/env from main ==="
            git pull origin main

            echo "=== pull prebuilt image from GHCR ==="
            docker compose -f docker-compose.prod.ghcr.yml pull

            echo "=== recreate container ==="
            docker compose -f docker-compose.prod.ghcr.yml up -d

            echo "=== wait for shared MySQL health ==="
            for i in $(seq 1 30); do
              if docker inspect axelnova-mysql --format='{{.State.Health.Status}}' 2>/dev/null | grep -q healthy; then
                echo "Shared MySQL is healthy"; break
              fi
              sleep 2
            done

            echo "=== health check ==="
            sleep 3
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is running"
            else
              echo "WARNING: app may not be responding"
              docker logs portfolio --tail 30
            fi

            echo "=== prune dangling images ==="
            docker image prune -f
